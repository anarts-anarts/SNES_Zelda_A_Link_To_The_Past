<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartucho NFC Retro</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container { 
            width: 100vw; 
            height: 100svh; 
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'snes';
        EJS_gameUrl = 'Zelda_A_Link_to_the_Past.sfc';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        EJS_gameName = 'Zelda_A_Link_to_the_Past';
        EJS_startOnLoaded = true;

        // Configurações adicionais de estabilidade
        EJS_loadState = ''; // Evita carregar estados corrompidos automaticamente se houver falha
        EJS_color = '#000000';
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

    <script>
        // Tenta salvar o progresso caso o usuário minimize ou mude de aba
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'hidden') {
                try {
                    if (typeof EJS_emulator !== 'undefined' && EJS_emulator.saveState) {
                        EJS_emulator.saveState();
                    }
                } catch (e) {
                    console.log('Não foi possível salvar automaticamente ao minimizar.');
                }
            }
        });
    </script>
</body>
</html>
