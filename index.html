<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartucho NFC Retro</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container { 
            width: 100vw; 
            height: 100svh; /* svh ajusta a altura dinamicamente no celular */
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'snes'; // Core do SNES (snes9x)
        EJS_gameUrl = 'Zelda-A-Link-to-the-Past.smc'; // Nome do arquivo da ROM na mesma pasta
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        /* Configurações para garantir o salvamento automático no celular */
        EJS_gameName = 'Zelda-A-Link-to-the-Past'; // Identificador único do save no navegador
        EJS_startOnLoaded = true;
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
